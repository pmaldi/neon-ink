<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>NeonInk</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <canvas id="board"></canvas>
  <canvas id="static"></canvas>
  <canvas id="fx"></canvas>

  <div id="frame"></div>
  <div id="heartbeat"></div>

  <div id="hud">
    <div class="pill">
      <span class="swatch"></span><span id="hud-color"></span>
      <i></i><span id="hud-tool"></span>
      <i></i><span id="hud-shapes"></span>
      <i></i><span id="hud-width"></span>
      <i></i><span class="muted" id="hud-hint"></span>
    </div>
  </div>

  <div id="toast"></div>
  <div id="flash"></div>

  <div id="help">
    <div class="help-panel">
      <header class="help-head">
        <h1><span class="neon-word">NeonInk</span></h1>
        <nav class="help-tabs" id="help-tabs" role="tablist" aria-label="Rubriques de l’aide"></nav>
        <input id="help-search" type="search" placeholder="Rechercher…" title="Rechercher dans tous les onglets et les plugins" autocomplete="off" spellcheck="false" />
      </header>
      <div class="help-body" id="help-body"></div>
      <p class="help-status" id="help-status" aria-live="polite"></p>
      <div class="help-foot">
        <span>Clic sur une touche pour la changer · <b>+</b> pour en ajouter une · clic droit pour la retirer</span>
        <span class="help-actions">
          <button id="help-reset" type="button">Touches d’origine</button>
          <button id="help-file" type="button">Ouvrir config.json</button>
        </span>
      </div>
    </div>
  </div>

  <div id="egg" aria-hidden="true"><pre></pre></div>
  <!-- Zone invisible qui reçoit la frappe de l'outil texte (accents, touches mortes, collage). -->
  <textarea id="text-input" autocomplete="off" spellcheck="false" aria-label="Texte"></textarea>

  <script type="module" src="main.js"></script>
</body>
</html>
