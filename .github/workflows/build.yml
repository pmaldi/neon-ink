name: Build Windows

on:
  push:
    branches: [main, 'ci/**']
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          # Le cache n'est sauvegardé que depuis main ; les branches le réutilisent.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: npm ci
      - run: npm test
      # Build de contrôle : optimisation plus légère (LTO « thin », 16 unités), environ 30 % plus
      # rapide. Les releases (release.yml) gardent l'optimisation complète, plus compacte.
      - run: npx tauri build --bundles nsis
        env:
          CARGO_PROFILE_RELEASE_LTO: thin
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: 16
      - uses: actions/upload-artifact@v4
        with:
          name: NeonInk-windows
          compression-level: 0
          retention-days: 14
          path: |
            src-tauri/target/release/NeonInk.exe
            src-tauri/target/release/bundle/nsis/*.exe

      # Tests sur la session Windows du runner (bureau réel, Edge installé)
      - run: pip install mss
      - name: Le calque s'affiche et Edge continue de se dessiner dessous
        shell: bash
        run: python scripts/ci/occlusion_test.py src-tauri/target/release/NeonInk.exe --expect live --shots shots
      - name: Installation, migration, mise à jour et désinstallation
        shell: pwsh
        timeout-minutes: 12
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $setup = (Get-ChildItem src-tauri/target/release/bundle/nsis/*-setup.exe).FullName
          ./scripts/ci/install_test.ps1 -Setup $setup
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: captures
          path: shots
