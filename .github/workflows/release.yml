name: Release

# Publié à chaque tag de version (vX.Y.Z), créé par `npm run release`.
on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Vérifier que le tag correspond à la version
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Le tag $GITHUB_REF_NAME ne correspond pas à package.json ($version)"; exit 1
          fi

      - run: npm ci
      - run: npm test
      - run: npx tauri build

      - name: Publier la release GitHub
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=${GITHUB_REF_NAME#v}
          node scripts/changelog-notes.js "$version" > notes.md
          # Version portable : l'exécutable seul, sans installation (WebView2 requis, déjà présent sur Windows 10 et 11).
          portable="NeonInk_${version}_x64_portable.exe"
          cp src-tauri/target/release/neon-ink.exe "$portable"
          gh release create "$GITHUB_REF_NAME" \
            --title "NeonInk $version" \
            --notes-file notes.md \
            src-tauri/target/release/bundle/nsis/*.exe \
            src-tauri/target/release/bundle/msi/*.msi \
            "$portable"
